# =============================================================================
# Alembic configuration for ConFam
#
# Migration tooling decision: Alembic — OQ-003 resolved in DECISIONS.md.
# Raw SQL migrations under Alembic version control (no ORM-generated DDL).
#
# Two connection strings are needed:
#   sqlalchemy.url  — used by Alembic/confam_migrator to apply schema changes.
#   (application)   — DATABASE_URL in .env, connects as confam_app at runtime.
# These must never be swapped. See db/migrations/007_create_roles_and_grants.sql.
#
# Usage:
#   alembic upgrade head           # apply all migrations
#   alembic upgrade +1             # apply next migration
#   alembic downgrade -1           # roll back one migration
#   alembic current                # show current revision
#   alembic history                # show migration history
#   alembic revision --autogenerate -m "description"   # generate new revision
#
# Engineering Rule 8: never put real credentials in this file.
# The sqlalchemy.url below reads from the environment variable
# ALEMBIC_DATABASE_URL, which must be set to a confam_migrator connection string.
# In local dev, copy .env.example → .env and set ALEMBIC_DATABASE_URL.
# In CI, the ledger-append-only job sets this via environment.
# =============================================================================

[alembic]
# %(here)s is the directory containing alembic.ini (the repo root).
script_location = %(here)s/alembic

# Reads from environment variable — Rule 8, never hardcode credentials here.
# Format: postgresql+psycopg2://confam_migrator:PASSWORD@HOST:PORT/DB
# Local dev default shown with placeholder password.
sqlalchemy.url = %(ALEMBIC_DATABASE_URL)s

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
