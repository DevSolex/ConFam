# =============================================================================
# ConFam CI — Main pipeline
#
# Stack: Python / FastAPI / PostgreSQL / pytest (all decisions resolved).
#
# CRITICAL JOB NAMES (do not rename without updating CONTRIBUTING.md):
#   no-double-count    — idempotency tests (Rule 3 / Rule 11)
#   ledger-append-only — Rule 2 structural enforcement tests
#
# Role setup per OQ-018 (resolved):
#   confam_migrator — applies migrations (ALEMBIC_DATABASE_URL)
#   confam_app      — application runtime role (TEST_DATABASE_URL)
#   The ledger-append-only job connects as BOTH to test each layer independently.
# =============================================================================

name: ConFam CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ---------------------------------------------------------------------------
  # Lint & static analysis
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Mypy type check
        run: mypy . --ignore-missing-imports

      # Secret scanning — Rule 8. Runs on every PR regardless of language.
      - name: Scan for secrets in diff
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  # ---------------------------------------------------------------------------
  # Unit tests (no database required)
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests (no database markers)
        run: pytest -m "not integration" -v

  # ---------------------------------------------------------------------------
  # NO-DOUBLE-COUNT TESTS (Rule 3 / Rule 11)
  # ---------------------------------------------------------------------------
  no-double-count:
    name: "no-double-count (Rule 3 / Rule 11)"
    runs-on: ubuntu-latest
    needs: unit-tests

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: confam_migrator
          POSTGRES_PASSWORD: confam_test
          POSTGRES_DB: confam_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      ALEMBIC_DATABASE_URL: postgresql+psycopg2://confam_migrator:confam_test@localhost:5432/confam_test
      TEST_DATABASE_URL: postgresql://confam_app:confam_test@localhost:5432/confam_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Create confam_app role
        run: |
          PGPASSWORD=confam_test psql \
            "postgresql://confam_migrator:confam_test@localhost:5432/confam_test" \
            -c "CREATE ROLE confam_app WITH LOGIN PASSWORD 'confam_test';"

      - name: Apply migrations via Alembic
        run: alembic upgrade head

      - name: Run no-double-count tests
        run: pytest -m no_double_count -v

  # ---------------------------------------------------------------------------
  # LEDGER APPEND-ONLY TESTS (Rule 2)
  #
  # Two-layer assertion:
  #   1. Privilege-level: connect as confam_app, assert UPDATE/DELETE rejected
  #      with InsufficientPrivilege (42501) — BEFORE the trigger fires.
  #   2. Trigger-level: connect as confam_migrator, assert UPDATE/DELETE
  #      rejected by the trigger with the 'append-only / Engineering Rule 2' message.
  # ---------------------------------------------------------------------------
  ledger-append-only:
    name: "ledger-append-only (Rule 2)"
    runs-on: ubuntu-latest
    needs: unit-tests

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: confam_migrator
          POSTGRES_PASSWORD: confam_test
          POSTGRES_DB: confam_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      ALEMBIC_DATABASE_URL: postgresql+psycopg2://confam_migrator:confam_test@localhost:5432/confam_test
      # TEST_DATABASE_URL connects as confam_app — used for privilege-level rejection assertion.
      TEST_DATABASE_URL: postgresql://confam_app:confam_test@localhost:5432/confam_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Create confam_app role
        run: |
          PGPASSWORD=confam_test psql \
            "postgresql://confam_migrator:confam_test@localhost:5432/confam_test" \
            -c "CREATE ROLE confam_app WITH LOGIN PASSWORD 'confam_test';"

      - name: Apply migrations via Alembic (creates all tables + roles + grants)
        run: alembic upgrade head

      - name: Run ledger-append-only tests (both privilege and trigger layers)
        run: pytest -m ledger_append_only -v

  # ---------------------------------------------------------------------------
  # Integration tests (full settlement flow, mocked rail adapters)
  # ---------------------------------------------------------------------------
  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: [no-double-count, ledger-append-only]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: confam_migrator
          POSTGRES_PASSWORD: confam_test
          POSTGRES_DB: confam_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      ALEMBIC_DATABASE_URL: postgresql+psycopg2://confam_migrator:confam_test@localhost:5432/confam_test
      TEST_DATABASE_URL: postgresql://confam_app:confam_test@localhost:5432/confam_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Create confam_app role
        run: |
          PGPASSWORD=confam_test psql \
            "postgresql://confam_migrator:confam_test@localhost:5432/confam_test" \
            -c "CREATE ROLE confam_app WITH LOGIN PASSWORD 'confam_test';"

      - name: Apply migrations via Alembic
        run: alembic upgrade head

      - name: Run integration tests
        run: pytest -m integration -v
